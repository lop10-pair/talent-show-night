<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Talent Show Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered stage column. Marquee header, team scoreboard strip, one game panel at a time. */
:root{
  --bg:#080c34; --panel:#121859; --panel2:#1b2275; --ice:#eef2ff; --ink:#0b1157;
  --gold:#ffc800; --blue:#2f5bea; --teal:#12a4a0; --coral:#e4572e; --amber:#d99a00; --slate:#6b7bb5;
  --mute:#a9b4ea; --line:#2c3590;
  --display:'Bungee','Impact','Arial Black',sans-serif;
  --body:'Be Vietnam Pro','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:#fff;font-family:var(--body);font-size:17px;line-height:1.45;
  background-image:radial-gradient(ellipse 60% 40% at 0% 0%,rgba(47,91,234,.35),transparent 70%),radial-gradient(ellipse 45% 35% at 100% 100%,rgba(255,200,0,.12),transparent 70%);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,p{margin:0}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:clamp(20px,4.6vw,34px);letter-spacing:.02em;color:var(--gold);text-shadow:0 0 18px rgba(255,200,0,.45);line-height:1.05}
.brand small{display:block;font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-shadow:none;margin-top:4px;font-weight:600}
.tools{display:flex;gap:8px}
.tbtn{padding:8px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:600}
.tbtn:hover{background:var(--panel2)}
.bulbs{position:relative;height:12px;margin:10px 0 12px}
.bulbs::before,.bulbs::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--gold) 0 3px,transparent 4px) 0 50%/24px 12px repeat-x;filter:drop-shadow(0 0 4px var(--gold));animation:blink 1.4s steps(1) infinite}
.bulbs::after{background-position:12px 50%;animation-delay:.7s;opacity:.25}
@keyframes blink{0%{opacity:1}50%{opacity:.25}}
.bulbs::after{animation-name:blink2}
@keyframes blink2{0%{opacity:.25}50%{opacity:1}}
/* scoreboard */
.board{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;align-items:stretch}
.chip{flex:0 0 auto;min-width:92px;border-radius:12px;background:var(--panel);border:2px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.chip.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,200,0,.22)}
.chipmain{padding:6px 12px 4px;text-align:left;display:flex;flex-direction:column}
.cn{font-size:12px;color:var(--mute);font-weight:600;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.chip.on .cn{color:var(--gold)}
.cs{font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.adj{display:flex;border-top:1px solid var(--line)}
.adj button{flex:1;padding:4px 0;font-size:18px;font-weight:700}
.adj button:hover{background:var(--panel2)}
.adjtog{flex:0 0 auto;align-self:center;padding:8px 12px;border-radius:10px;border:1px dashed var(--line);color:var(--mute);font-size:13px;font-weight:600}
.adjtog[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3.5vw,28px)}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
h2{font-family:var(--display);font-size:clamp(24px,5.2vw,40px);line-height:1.1;margin:6px 0 6px;text-wrap:balance;font-weight:400}
.sub{color:var(--mute);font-size:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.btn{padding:12px 22px;border-radius:12px;font-weight:700;font-size:17px;background:var(--gold);color:var(--ink);box-shadow:0 3px 0 #b88f00}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b88f00}
.btn.ghost{background:var(--panel2);color:#fff;box-shadow:none;border:1px solid var(--line)}
.btn.big{padding:16px 30px;font-size:20px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* setup */
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:24px;font-weight:700}
.stepper b{font-family:var(--display);font-size:38px;min-width:2ch;text-align:center;font-weight:400;font-variant-numeric:tabular-nums}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.names input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:#fff;font:inherit;font-size:15px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rule{background:var(--bg);border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.rule b{display:block;color:var(--gold);font-size:15px}
.rule span{font-size:15px;color:var(--mute)}
.teachernote{font-size:14px;color:var(--mute);border-left:3px solid var(--teal);padding-left:12px}
/* hub */
.stages{display:flex;flex-direction:column;gap:10px}
.stg{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--ice);color:var(--ink);padding:12px 16px;border-radius:14px}
.stg:hover{filter:brightness(.97)}
.num{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:22px}
.stg b{display:block;font-size:19px;line-height:1.2}
.stg span{font-size:14px;color:#3b4271}
.stat{font-size:14px;font-weight:700;color:#3b4271;text-align:right;white-space:nowrap}
.stat.fin{color:#0d7a76}
.c0{background:var(--blue)}.c1{background:var(--teal)}.c2{background:var(--amber)}.c3{background:var(--coral)}.c4{background:var(--slate)}.c5{background:#0d8a86}
/* grid of boxes */
.boxes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.boxes.w8{grid-template-columns:repeat(2,1fr)}
@media(min-width:620px){.boxes{grid-template-columns:repeat(3,1fr)}.boxes.w8{grid-template-columns:repeat(4,1fr)}}
.box{min-height:112px;border-radius:16px;color:#fff;font-family:var(--display);font-size:clamp(32px,7vw,56px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .12s;padding:10px;text-align:center;line-height:1.05}
.box.t{font-size:clamp(18px,3.6vw,26px)}
.box:hover:not(:disabled){transform:translateY(-3px) rotate(-1deg)}
.box:disabled{background:var(--bg);color:var(--mute);box-shadow:none;border:2px dashed var(--line);cursor:default;font-size:15px;font-family:var(--body);font-weight:600}
.box:disabled b{font-size:26px;color:var(--gold);font-family:var(--display);font-weight:400}
/* question */
.qwrap{display:flex;flex-direction:column;gap:16px}
.turn{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--gold);color:var(--gold);padding:6px 14px;border-radius:999px;font-weight:700;font-size:15px;align-self:flex-start}
.scene{align-self:center;display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,14px);padding:14px clamp(18px,5vw,40px);border-radius:24px;background:radial-gradient(circle at 50% 35%,var(--panel2),var(--bg) 85%);border:1px solid var(--line);box-shadow:0 0 0 4px rgba(255,200,0,.10),0 10px 30px rgba(0,0,0,.35);line-height:1}
.scene span{display:block}
.scene .e0{font-size:clamp(60px,15vw,104px)}
.scene .e1,.scene .e2{font-size:clamp(34px,8vw,56px);opacity:.95}
.scene .e1{transform:rotate(-8deg)}.scene .e2{transform:rotate(8deg)}
.box .em{font-size:clamp(26px,5vw,40px);font-family:var(--body);line-height:1}
.q{font-size:clamp(22px,4.6vw,34px);font-weight:700;line-height:1.25;text-align:center;text-wrap:balance}
.tmr{height:10px;border-radius:999px;background:var(--bg);overflow:hidden;position:relative}
.tmr i{position:absolute;inset:0;background:linear-gradient(90deg,var(--coral),var(--gold) 40%,var(--teal));transform-origin:left;transform:scaleX(1)}
.tnum{font-family:var(--display);font-size:22px;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:14px 18px;border-radius:14px;background:var(--ice);color:var(--ink);font-size:clamp(18px,3.6vw,26px);font-weight:600;border:3px solid transparent;transition:transform .1s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--gold)}
.opt i{font-style:normal;flex:0 0 auto;width:40px;height:40px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.opt.ok{background:#bdf3ec;border-color:var(--teal)}
.opt.bad{background:#ffd7cc;border-color:var(--coral)}
.opt.dim{opacity:.45}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:14px 18px;font-size:18px}
.fb.ok{background:rgba(18,164,160,.2);border:2px solid var(--teal)}
.fb.bad{background:rgba(228,87,46,.2);border:2px solid var(--coral)}
.fb b{font-family:var(--display);font-weight:400;font-size:24px;display:block;margin-bottom:2px}
.fb .why{color:var(--mute);font-size:16px;margin-top:4px}
details.peek{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.peek summary{cursor:pointer;font-weight:700;color:var(--gold)}
details.peek p{margin-top:8px;color:#dce3f7;font-size:17px}
/* words */
.slots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:52px}
.slot{width:clamp(28px,6.6vw,44px);height:clamp(38px,8.4vw,52px);border-bottom:4px solid var(--gold);display:grid;place-items:center;font-family:var(--display);font-size:clamp(20px,4.6vw,30px);color:#fff}
.slot.gap{border:0;width:16px}
.slots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tile{width:clamp(38px,9vw,56px);height:clamp(44px,10vw,60px);border-radius:12px;background:var(--ice);color:var(--ink);font-family:var(--display);font-size:clamp(20px,5vw,30px);box-shadow:0 4px 0 #9aa6dd}
.tile:disabled{opacity:.25;box-shadow:none}
.hintline{text-align:center;color:var(--mute);font-size:16px;min-height:26px}
/* cast */
.promptcard{background:var(--bg);border:1px dashed var(--gold);border-radius:14px;padding:14px 16px;font-size:16px;font-style:italic;color:#e6ebff;white-space:pre-wrap}
.promptcard mark{background:var(--gold);color:var(--ink);padding:0 4px;border-radius:4px;font-style:normal;font-weight:700}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.card{border-radius:14px;padding:14px 16px;background:var(--panel2);border:1px solid var(--line)}
.card b{display:block}
.card.light{background:var(--ice);color:var(--ink);font-size:18px;font-weight:600}
.card h3{font-size:17px;color:var(--gold);margin-bottom:4px}
.card small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.stars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stars button{padding:12px 4px;border-radius:12px;background:var(--panel2);border:2px solid var(--line);font-weight:700}
.stars button:hover{border-color:var(--gold)}
.stars b{display:block;font-family:var(--display);font-size:28px;font-weight:400;color:var(--gold)}
.stars span{font-size:13px;color:var(--mute)}
.clock{font-family:var(--display);font-size:42px;font-variant-numeric:tabular-nums}
/* detective */
.sentence{background:var(--ice);color:var(--ink);border-radius:16px;padding:22px;font-size:clamp(22px,4.8vw,34px);font-weight:700;text-align:center;line-height:1.3;text-wrap:balance}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two button{padding:18px 8px;border-radius:14px;font-size:clamp(18px,4vw,26px);font-weight:700;color:#fff}
.two button:disabled{opacity:.4;cursor:default}
/* leaderboard */
.podium{display:flex;justify-content:center;align-items:flex-end;gap:10px;margin:8px 0}
.pod{flex:1;max-width:210px;border-radius:14px 14px 0 0;color:var(--ink);text-align:center;padding:10px 6px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.pod b{font-family:var(--display);font-weight:400;font-size:clamp(26px,6vw,40px);line-height:1}
.pod span{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.pod em{font-style:normal;font-size:14px}
.p1{background:var(--gold);height:190px}.p2{background:#c3c9e6;height:145px}.p3{background:#e0a24a;height:115px}
.lb{display:grid;gap:6px}
.lbr{display:grid;grid-template-columns:34px 1fr 54px;gap:10px;align-items:center}
.lbr .rk{font-family:var(--display);color:var(--gold);text-align:center}
.bar{height:26px;border-radius:8px;background:var(--bg);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:8px}
.bar span{position:relative;padding-left:10px;line-height:26px;font-size:14px;font-weight:700;white-space:nowrap}
.lbr .sc{text-align:right;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.hist{font-size:14px;color:var(--mute)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){.bulbs::before,.bulbs::after,.slots.shake{animation:none}.box,.opt{transition:none}}
</style>

<div class="wrap">
  <div class="top">
    <h1 class="brand">Talent Show Night<small>Unit 3 · Music · Getting started · PAIR</small></h1>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- content (original, written for this lesson) ---------- */
var PASSAGE='Last year, Mai joined the music club at her school. She plays the trumpet and she is very good at it. The club has performed at three festivals. Last month, Mai uploaded a video of their show on social media, and a teacher shared it. Now the club has received its first award.';
var G1=[
 ['Which instrument do you blow into? It has three valves.',['trumpet','drum','piano'],0,'🎺🎶','A trumpet has three valves. You blow into it.'],
 ['“Perform” means…',['to buy something','to show a song or play to an audience','to go to sleep'],1,'🎤🎭🌟','Perform = show a song, a play or a dance to an audience.'],
 ['Which one is social media?',['a school library','a paper map','a platform where people share videos and photos'],2,'📱🎬📸','Social media = websites and apps for sharing videos, photos and messages.'],
 ['An award is…',['a prize for doing something very well','a kind of song','a music teacher'],0,'🏆🏅🥇','Award = a prize. “The club has received its first award.”'],
 ['She is good ____ drawing.',['in','at','on'],1,'🎨📝👍','be good at + noun / V-ing.'],
 ['The opposite of “upload” is…',['perform','download','sing'],1,'📤🌐💻','upload ↔ download.']
];
var G2=[
 ['What does Mai play?',['the drums','the piano','the trumpet'],2,'👧🎺🎶','“She plays the trumpet.”'],
 ['How many festivals has the club performed at?',['three','two','ten'],0,'🎪🎶🎉','“The club has performed at three festivals.”'],
 ['Where did Mai upload the video?',['on social media','at a theatre','in a library'],0,'📱🎬📤','“Mai uploaded a video … on social media.”'],
 ['Who shared the video?',['her mother','a teacher','a singer'],1,'🏫📣📱','“… and a teacher shared it.”'],
 ['What has the club received?',['a new trumpet','a concert ticket','its first award'],2,'🏆🏅🎉','“Now the club has received its first award.”'],
 ['When did Mai join the music club?',['last year','yesterday','next month'],0,'📅🎼🏫','“Last year, Mai joined the music club.”']
];
var WORDS=[['talented','tài năng','🌟'],['social media','mạng xã hội','📱'],['trumpet','kèn trumpet','🎺'],['perform','biểu diễn','🎭'],['award','giải thưởng','🏆'],['upload','đăng tải','📤'],['be good at','giỏi về','👍'],['musical instrument','nhạc cụ','🎸']];
var TOPICS=[['a talented singer','singer','🎤🎶🌟'],['a talented guitarist','guitarist','🎸🎵🌟'],['a talented dancer','dancer','💃🕺🎶'],['a talented painter','painter','🎨🌈🌟'],['a school music club','music club','🎻🥁🎺'],['a teen idol','teen idol','🌟📸🎤']];
var ED=[
 ['Linh has performed at the festival last week.',false,'Linh performed at the festival last week.','last week = past simple','🎪📅🎉'],
 ['He has received three awards so far.',true,'No mistake.','“so far” goes with the present perfect','🏆🏅🏆'],
 ['She didn’t went to a music school.',false,'She didn’t go to a music school.','didn’t + base verb','🏫🎼🎶'],
 ['My brother is good at play the trumpet.',false,'My brother is good at playing the trumpet.','at + V-ing','🎺🎓👦'],
 ['They uploaded a video yesterday.',true,'No mistake.','“yesterday” goes with the past simple','📹📅📤'],
 ['He is a singer who write his own songs.',false,'He is a singer who writes his own songs.','he / she + verb-s','🎤📝🎵']
];
var PROMPT='“You are Ann, a friendly Vietnamese high-school student. Talk with me, a Grade 10 student, about [ARTIST]. Use simple English (CEFR A2–B1). Ask ONE question at a time and wait for my answer. Do 5 turns. Do not answer for me. After turn 5, give feedback: 2 things I did well, 2 mistakes (my sentence → better sentence → why), 1 tip. Do not ask for personal information.”';

var STAGES=[
 {id:'boxes',no:1,name:'Backstage Boxes',sub:'Music quiz warm-up',type:'mcq',items:G1,color:'c0',intro:false},
 {id:'words',no:2,name:'Word Scramble',sub:'Learn 8 new words · step P',type:'words',items:WORDS,color:'c1'},
 {id:'read',no:3,name:'Who is faster?',sub:'Reading battle · fast answer = bonus',type:'mcq',fast:true,items:G2,color:'c2',intro:true},
 {id:'cast',no:4,name:'Casting + Interview',sub:'Talk with AI Ann · step A',type:'cast',items:TOPICS,color:'c3',intro:true},
 {id:'detect',no:5,name:'Error Detective',sub:'Catch the AI’s mistakes · step I',type:'detect',items:ED,color:'c4',intro:true}
];
var ST=function(id){return STAGES.filter(function(s){return s.id===id})[0]};

/* ---------- sound ---------- */
var muted=LS.get('tsn_mute')==='1',AC=null;
function tone(f,d,type,t0,vol){ if(muted)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(t0||0); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.16,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.05);}catch(e){} }
var sfx={
 ok:function(){tone(660,.14,'triangle',0);tone(880,.14,'triangle',.12);tone(1320,.3,'triangle',.24)},
 bad:function(){tone(220,.22,'sawtooth',0,.1);tone(165,.35,'sawtooth',.2,.1)},
 tick:function(){tone(1000,.05,'square',0,.05)},
 pop:function(){tone(520,.08,'sine',0,.12)},
 fan:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.25,'triangle',i*.14,.18)});tone(1047,.7,'triangle',.6,.18)}
};
function setMute(m){muted=m;LS.set('tsn_mute',m?'1':'0');var b=$('#mutebtn');b.textContent=m?'Sound off':'Sound on';b.setAttribute('aria-pressed',m?'true':'false')}

/* ---------- state ---------- */
var KEY='tsn_save_v1',S=null,T={};
var setupState={n:10,names:null,timer:30};
function defNames(n){var a=[];for(var i=0;i<n;i++)a.push((setupState.names&&setupState.names[i])||'Team '+(i+1));return a}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function save(){if(S)LS.set(KEY,JSON.stringify(S))}
function loadSaved(){try{var s=JSON.parse(LS.get(KEY));return s&&s.teams?s:null}catch(e){return null}}
function newGame(){
  var names=defNames(setupState.n).map(function(n,i){return (n||'').trim()||'Team '+(i+1)});
  S={teams:names.map(function(n){return {name:n,score:0}}),turn:0,timer:setupState.timer,screen:'hub',stage:null,idx:null,done:{},intro:{},perm:{},adjust:false,saved:false};
  STAGES.forEach(function(st){S.done[st.id]={};st.items.forEach(function(it,i){
    if(st.type==='mcq'||st.type==='detect') S.perm[st.id+i]=shuffle([0,1,2]);
    if(st.type==='words'){var L=it[0].replace(/ /g,'').split('').map(function(_,k){return k});var p=shuffle(L),tries=0;while(p.join()===L.join()&&tries++<5)p=shuffle(L);S.perm[st.id+i]=p}
  })});
  save();
}
function award(p){S.teams[S.turn].score+=p}
function nextTurn(){S.turn=(S.turn+1)%S.teams.length}
var totalDone=function(st){return Object.keys(S.done[st.id]).length};

/* ---------- timer ---------- */
function stopTimer(){if(T.int){clearInterval(T.int);T.int=null}}
function startTimer(sec,onEnd){
  stopTimer(); if(!sec)return;
  T.end=Date.now()+sec*1000;T.tot=sec*1000;T.lastSec=sec;
  T.int=setInterval(function(){
    var left=T.end-Date.now(),bar=$('#tbar'),lab=$('#tnum');
    if(bar)bar.style.transform='scaleX('+Math.max(0,left/T.tot)+')';
    var s=Math.ceil(Math.max(0,left)/1000);
    if(lab)lab.textContent=s;
    if(s!==T.lastSec){T.lastSec=s;if(s<=5&&s>0)sfx.tick()}
    if(left<=0){stopTimer();onEnd()}
  },100);
}
var scene=function(str){return '<div class="scene" aria-hidden="true">'+Array.from(str).map(function(c,i){return '<span class="e'+i+'">'+c+'</span>'}).join('')+'</div>'};
var timerBar=function(){return S.timer?'<div class="row" style="flex-wrap:nowrap"><div class="tmr" style="flex:1"><i id="tbar"></i></div><div class="tnum" id="tnum">'+S.timer+'</div></div>':''};

   '<div><div class="eyebrow" style="color:var(--mute)">Timer per question</div><div class="seg">'+[[0,'Off'],[20,'20 s'],[30,'30 s'],[45,'45 s']].map(function(t){return '<button data-a="tm" data-v="'+t[0]+'" aria-pressed="'+(setupState.timer===t[0])+'">'+t[1]+'</button>'}).join('')+'</div></div></div>'+

function ranks(){
  var arr=S.teams.map(function(t,i){return {i:i,name:t.name,score:t.score}}).sort(function(a,b){return b.score-a.score});
  arr.forEach(function(r,k){r.rank=(k>0&&arr[k-1].score===r.score)?arr[k-1].rank:k+1});
  return arr;
}
function vAwards(){
  var arr=ranks(),max=Math.max(1,arr[0].score),top=arr.slice(0,3),winners=arr.filter(function(r){return r.rank===1}).map(function(r){return esc(r.name)});
  var order=top.length===3?[top[1],top[0],top[2]]:top,cls={1:'p1',2:'p2',3:'p3'};
  var pod='<div class="podium">'+order.map(function(r){var k=top.indexOf(r)+1;return '<div class="pod '+cls[k]+'"><em>'+['1st','2nd','3rd'][k-1]+'</em><span>'+esc(r.name)+'</span><b>'+r.score+'</b></div>'}).join('')+'</div>';
  var lb='<div class="lb">'+arr.map(function(r){return '<div class="lbr"><span class="rk">'+r.rank+'</span><div class="bar"><i style="width:'+(r.score/max*100)+'%"></i><span>'+esc(r.name)+'</span></div><span class="sc">'+r.score+'</span></div>'}).join('')+'</div>';
  var hist='';try{var h=JSON.parse(LS.get('tsn_hist')||'[]');if(h.length)hist='<div class="hist"><b>Earlier shows on this device:</b> '+h.slice(-4).reverse().map(function(x){return esc(x.d)+' · winner '+esc(x.w)+' ('+x.s+')'}).join(' &nbsp;|&nbsp; ')+'</div>'}catch(e){}
  return '<div class="panel stack"><div><div class="eyebrow">Award ceremony</div><h2>And the award goes to… '+winners.join(' &amp; ')+'!</h2></div>'+pod+lb+
   '<div class="row"><button class="btn big" data-a="again">Play again, same teams</button><button class="btn ghost" data-a="newteams">New teams</button><button class="btn ghost" data-a="hub">Stages</button></div>'+
   '<div class="card"><h3>Homework</h3><b style="font-weight:500">Workbook exercises. Prompt Card 3: write 4–5 sentences about your artist. Ask AI for hints, not a rewrite.</b></div>'+hist+'</div>';
}

/* ---------- render ---------- */
function renderBoard(){
  var b=$('#board');
  if(!S||S.screen==='setup'){b.hidden=true;$('#hubbtn').hidden=true;return}
  var sl=b.scrollLeft;b.hidden=false;$('#hubbtn').hidden=false;
  b.innerHTML=S.teams.map(function(t,i){return '<div class="chip '+(i===S.turn?'on':'')+'"><button class="chipmain" data-a="team" data-i="'+i+'" title="Set as current team"><span class="cn">'+esc(t.name)+'</span><span class="cs">'+t.score+'</span></button>'+(S.adjust?'<span class="adj"><button data-a="minus" data-i="'+i+'" aria-label="Minus one for '+esc(t.name)+'">−</button><button data-a="plus" data-i="'+i+'" aria-label="Plus one for '+esc(t.name)+'">+</button></span>':'')+'</div>'}).join('')+'<button class="adjtog" data-a="adjust" aria-pressed="'+!!S.adjust+'">± Adjust</button>';
  b.scrollLeft=sl;
}
function render(){
  renderBoard();
  var m=$('#main'),scr=S?S.screen:'setup',st=S&&S.stage?ST(S.stage):null,h='';
  if(scr==='setup')h=vSetup();
  else if(scr==='hub')h=vHub();
  else if(scr==='intro')h=vIntro(st);
  else if(scr==='grid')h=vGrid(st);
  else if(scr==='item')h=st.type==='mcq'?vMcq(st):st.type==='detect'?vDetect(st):st.type==='words'?vWord(st):vCast(st);
  else if(scr==='exit')h=vExit();
  else if(scr==='awards')h=vAwards();
  m.innerHTML=h;
  if(scr==='item'&&!T.ans&&st.type!=='cast')startTimerForItem(st);
  if(scr==='awards')confetti();
}
function startTimerForItem(st){
  if(T.timerFor===S.stage+S.idx&&T.int)return;
  T.timerFor=S.stage+S.idx;
  startTimer(st.type==='words'?S.timer*2:S.timer,function(){timeout(st)});
}
function timeout(st){
  if(T.ans)return;T.ans={ok:false,timeout:true,pts:0,pick:-1};S.done[st.id][S.idx]={team:S.turn,pts:0};sfx.bad();save();render();
}

/* ---------- actions ---------- */
function spStop(){if(T.spInt){clearInterval(T.spInt);T.spInt=null}T.spOn=false}
function go(screen){stopTimer();spStop();T.timerFor=null;S.screen=screen;save();render();window.scrollTo({top:0})}
var A={
 n:function(d){setupState.n=Math.max(2,Math.min(10,setupState.n+(+d.d)));render()},
 tm:function(d){setupState.timer=+d.v;render()},
 start:function(){newGame();render()},
 resume:function(){S=loadSaved();if(S.screen==='item')S.screen='hub';T={};render()},
 hub:function(){S.stage=null;go('hub')},
 mute:function(){setMute(!muted)},
 stage:function(d){var st=ST(d.id);S.stage=st.id;if(st.intro&&!S.intro[st.id])go('intro');else go('grid')},
 introdone:function(){S.intro[S.stage]=true;go('grid')},
 open:function(d){var st=ST(S.stage);S.idx=+d.i;T.ans=null;T.t0=Date.now();T.built=[];T.hint=false;T.shake=false;T.sp=60;T.spOn=false;sfx.pop();go('item')},
 back:function(){go('grid')},
 pick:function(d){
  if(T.ans)return;stopTimer();var st=ST(S.stage),it=st.items[S.idx],orig=S.perm[st.id+S.idx][+d.k],ok=orig===it[2],pts=0;
  if(ok){pts=1;if(st.fast&&(Date.now()-T.t0)/1000<=8)pts=2}
  award(pts);T.ans={pick:+d.k,ok:ok,pts:pts};S.done[st.id][S.idx]={team:S.turn,pts:pts};ok?sfx.ok():sfx.bad();save();render();
 },
 say:function(d){
  if(T.ans)return;stopTimer();var st=ST(S.stage),it=st.items[S.idx],says=d.v==='c',right=it[1],ok=says===right,pts=ok?(right?1:2):0;
  award(pts);T.ans={ok:ok,pts:pts};S.done[st.id][S.idx]={team:S.turn,pts:pts};ok?sfx.ok():sfx.bad();save();render();
 },
 tile:function(d){if(T.ans)return;var st=ST(S.stage),it=st.items[S.idx],tiles=S.perm[st.id+S.idx];T.built.push(+d.i);sfx.pop();
  var letters=it[0].replace(/ /g,'').split('');
  if(T.built.length===letters.length){
    var guess=T.built.map(function(k){return letters[tiles[k]]}).join('');
    if(guess===letters.join('')){stopTimer();var pts=T.hint?1:2;award(pts);T.ans={ok:true,pts:pts};S.done[st.id][S.idx]={team:S.turn,pts:pts};sfx.ok();save();render();return}
    sfx.bad();T.shake=true;render();setTimeout(function(){T.built=[];T.shake=false;if(S.screen==='item'&&!T.ans)render()},700);return;
  }
  render()},
 undo:function(){T.built.pop();render()},
 clear:function(){T.built=[];render()},
 hint:function(){T.hint=true;render()},
 score:function(d){if(T.ans)return;var st=ST(S.stage),p=+d.v;award(p);T.ans={ok:true,pts:p};S.done[st.id][S.idx]={team:S.turn,pts:p};p>0?sfx.ok():sfx.pop();spStop();save();render()},
 next:function(){nextTurn();go('grid')},
 sp:function(){
  if(T.spOn){spStop();var b=$('#spbtn');if(b)b.textContent='Resume';return}
  var st=S.screen==='exit'?180:60;if(!T.sp||T.sp<=0)T.sp=st;T.spOn=true;var b2=$('#spbtn');if(b2)b2.textContent='Pause';
  T.spInt=setInterval(function(){T.sp--;var n=$('#spnum');if(n)n.textContent=fmt(T.sp);if(T.sp<=5&&T.sp>0)sfx.tick();if(T.sp<=0){spStop();sfx.fan();var bb=$('#spbtn');if(bb)bb.textContent='Time!'}},1000);
 },
 copy:function(){
  var txt=PROMPT.replace('[ARTIST]',ST(S.stage).items[S.idx][0]),b=$('#copybtn');
  function sel(){var r=document.createRange();r.selectNodeContents($('#pc'));var s=getSelection();s.removeAllRanges();s.addRange(r);if(b)b.textContent='Text selected: press Ctrl/⌘ + C'}
  try{navigator.clipboard.writeText(txt).then(function(){if(b)b.textContent='Copied ✓'},sel)}catch(e){sel()}
 },
 team:function(d){S.turn=+d.i;save();renderBoard();if(S.screen==='grid'||S.screen==='item')render()},
 adjust:function(){S.adjust=!S.adjust;renderBoard()},
 plus:function(d){S.teams[+d.i].score++;save();renderBoard()},
 minus:function(d){S.teams[+d.i].score--;save();renderBoard()},
 exit:function(){T.sp=180;go('exit')},
 awards:function(){
  if(!S.saved){S.saved=true;try{var h=JSON.parse(LS.get('tsn_hist')||'[]'),r=ranks()[0];h.push({d:new Date().toLocaleDateString('en-GB'),w:r.name,s:r.score});LS.set('tsn_hist',JSON.stringify(h.slice(-10)))}catch(e){}}
  sfx.fan();go('awards')},
 again:function(){S.teams.forEach(function(t){t.score=0});S.turn=0;S.saved=false;S.intro={};STAGES.forEach(function(st){S.done[st.id]={}});S.stage=null;go('hub')},
 newteams:function(){stopTimer();spStop();S=null;LS.set(KEY,'');render()}
};
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;var f=A[b.dataset.a];if(f)f(b.dataset)});
document.addEventListener('input',function(e){var t=e.target;if(t.dataset&&t.dataset.name!==undefined){setupState.names=setupState.names||[];setupState.names[+t.dataset.name]=t.value}});
document.addEventListener('keydown',function(e){
  if(!S||S.screen!=='item'||T.ans)return;var st=ST(S.stage);if(st.type!=='mcq')return;
  var k={'a':0,'b':1,'c':2,'1':0,'2':1,'3':2}[e.key.toLowerCase()];if(k!==undefined&&document.activeElement.tagName!=='INPUT')A.pick({k:k});
});

/* ---------- confetti ---------- */
function confetti(){
  var c=$('#fx'),x=c.getContext('2d');if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  c.width=innerWidth;c.height=innerHeight;var cols=['#ffc800','#2f5bea','#12a4a0','#e4572e','#eef2ff'],P=[];
  for(var i=0;i<140;i++)P.push({x:Math.random()*c.width,y:-Math.random()*c.height*.6,w:6+Math.random()*7,h:10+Math.random()*8,v:2+Math.random()*3.5,r:Math.random()*6,s:(Math.random()-.5)*.25,c:cols[i%5],d:(Math.random()-.5)*1.5});
  var t0=Date.now();(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(function(p){p.y+=p.v;p.x+=p.d;p.r+=p.s;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()});if(Date.now()-t0<4500)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

setMute(muted);render();
})();
</script>
